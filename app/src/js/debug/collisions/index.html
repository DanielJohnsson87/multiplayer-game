<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asteroid Field</title>
    <script type="module" src="collisions.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #05060f;
            color: #c0c8e0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #0ED2FF;
            margin-bottom: 10px;
            opacity: 0.7;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }
        .instruction {
            font-size: 13px;
            color: #7a82a0;
        }
        .key {
            background: rgba(14, 210, 255, 0.15);
            border: 1px solid rgba(14, 210, 255, 0.3);
            padding: 1px 6px;
            border-radius: 3px;
            color: #0ED2FF;
            font-size: 12px;
            font-family: inherit;
        }
        canvas {
            border: 1px solid rgba(14, 210, 255, 0.15);
            border-radius: 2px;
            touch-action: none;
        }
        @media (max-width: 1250px) {
            html { height: 100%; }
            body {
                height: 100dvh;
                padding: 0;
                justify-content: flex-start;
                overflow: hidden;
            }
            h1 { display: none; }
            .controls { display: none; }
            .debug-buttons { display: none !important; }
            canvas {
                display: block;
                width: 100vw !important;
                height: 50vw !important;
                max-height: 100dvh !important;
                border: none !important;
            }
        }
        @media (max-width: 1250px) and (orientation: landscape) {
            canvas {
                width: auto !important;
                height: 100dvh !important;
                max-width: 100vw !important;
            }
        }
        .debug-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .debug-buttons button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #7a82a0;
            padding: 5px 12px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .debug-buttons button:hover {
            background: rgba(14, 210, 255, 0.1);
            border-color: rgba(14, 210, 255, 0.3);
            color: #0ED2FF;
        }
    </style>
</head>
<body>
    <h1>Asteroid Field</h1>
    <div class="controls">
        <span class="instruction"><span class="key">Arrow keys</span> Move &amp; rotate</span>
        <span class="instruction"><span class="key">Q</span> Attract</span>
        <span class="instruction"><span class="key">W</span> Repel</span>
    </div>
    <canvas id="canvas" width="1200" height="600" style="width: 1200px; height: 600px;"></canvas>
    <div class="debug-buttons">
        <button id="showGrid">Collision grid</button>
        <button id="showGravityGrid">Gravity grid</button>
        <button id="showClosestPointToWall">Wall proximity</button>
    </div>
</body>
</html>
